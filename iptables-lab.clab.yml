name: iptables-lab

topology:
  nodes:
    attacker:
      kind: linux
      image: alpine:latest
      exec:
        - apk update
        - apk add --no-cache iproute2 iputils nmap curl openssh-client hydra netcat-openbsd
        - apk add --no-cache --repository=http://dl-cdn.alpinelinux.org/alpine/edge/testing hping3
        - ip addr add 10.0.1.2/24 dev eth1
        - ip route replace default via 10.0.1.1

    firewall:
      kind: linux
      image: debian:latest
      exec:
        - apt-get update
        - apt-get install -y iptables iproute2 procps tcpdump
        - ip addr add 10.0.1.1/24 dev eth1
        - ip addr add 10.0.2.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1

    victim:
      kind: linux
      image: debian:latest
      exec:
        - apt-get update
        - apt-get install -y nginx openssh-server iproute2 vim
        - ip addr add 10.0.2.2/24 dev eth1
        - ip route replace default via 10.0.2.1
        - mkdir -p /run/sshd
        - ssh-keygen -A
        - nginx
        - /usr/sbin/sshd
  links:
    - endpoints: ["attacker:eth1", "firewall:eth1"]
    - endpoints: ["firewall:eth2", "victim:eth1"]
